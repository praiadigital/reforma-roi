<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reforma ROI — Vale a pena reformar? | Praia Digital</title><meta name="description" content="Simule o retorno da reforma do seu imóvel do litoral antes de vender ou alugar para temporada."><link rel="canonical" href="https://praia.digital/reforma-roi/"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#0f172a;line-height:1.6}.hero{background:linear-gradient(135deg,#0c4a6e,#0ea5e9);color:#fff;padding:60px 20px;text-align:center}.container{max-width:780px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:13px;padding:24px;margin-bottom:16px;box-shadow:0 3px 10px #0001}label{display:block;font-weight:600;margin:12px 0 4px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;box-sizing:border-box}button{background:#0ea5e9;color:#fff;border:0;padding:14px 28px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;width:100%;margin-top:16px}.result{text-align:center;font-size:1.15rem}a.app{color:#0c4a6e;font-weight:600}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header class="hero"><h1>🏗️ Reforma ROI</h1><p>Vale a pena reformar antes de vender ou alugar? Simule em 30 segundos.</p></header><main class="container"><div class="card"><label>Valor atual do imóvel (R$)</label><input id="v" type="number" value="650000"><label>Custo estimado da reforma (R$)</label><input id="c" type="number" value="40000"><label>Tipo de reforma</label><select id="t"><option value="0.05">Pintura e reparos gerais</option><option value="0.08">Banheiro completo</option><option value="0.10">Cozinha moderna</option><option value="0.15">Reforma completa (cômodos plus)</option><option value="0.07">Mobiliado/pronto para temporada</option></select><label>Objetivo</label><select id="o"><option value="venda">Vender o imóvel</option><option value="aluguel">Alugar para temporada</option></select><button onclick="calc()">Simular retorno</button></div><div class="card result" id="out" style="display:none"></div><div class="card"><strong>Próximo passo:</strong><br>🏠 <a class="app" href="https://praia.digital/avaliador-imoveis/">Avaliador de Imóveis</a> — confira o valor por m²<br>📡 <a class="app" href="https://praia.digital/radar-precos/">Radar de Preços</a> — preço por bairro<br>🔑 <a class="app" href="https://praia.digital/area-anfitriao/">Área do Anfitrião</a> — gerencie a locação</div></main><footer><a class="app" href="https://praia.digital/apps/">🌐 Apps Praia Digital</a> · <a class="app" href="https://praia.digital/">praia.digital</a></footer><script>function calc(){var v=+d.getElementById('v').value,c=+d.getElementById('c').value,t=+d.getElementById('t').value,o=d.getElementById('o').value;var ganho=v*t;var roi=((ganho-c)/c)*100;var html='<p>Valorização estimada: <strong>'+(t*100).toFixed(0)+'%</strong> (R$ '+ganho.toLocaleString('pt-BR')+')</p><p>Retorno sobre o investimento: <strong>'+roi.toFixed(0)+'%</strong></p>';if(o==='aluguel'){var diariaExtra=v*0.0006*t*10;var payback=c/(diariaExtra*12);html+='<p>Diária extra estimada: <strong>R$ '+diariaExtra.toFixed(0)+'/noite</strong></p><p>Payback: <strong>'+payback.toFixed(1)+' meses</strong> de locação</p>';}if(roi<0){html+='<p style="color:#dc2626"><strong>Atenção: reforma pouco rentável para este valor de imóvel. Avalie uma opção mais básica.</strong></p>';}d.getElementById('out').style.display='block';d.getElementById('out').innerHTML=html;}var d=document;</script></body></html>
